# CCL Configuration
# Place at ~/.config/cclauncher/config.yaml
#
# Values support environment variable interpolation:
#   ${VAR}           - replaced with env var value (empty if unset)
#   ${VAR:-default}  - replaced with env var value, or "default" if unset
#
# Model choices are user-owned: set model/smallFastModel or the env vars below.
# No model IDs are selected by the shipped defaults.
# Priority: config file value (with env interpolation) > shipped default
# Additionally, CCL_<PROVIDER>_API_KEY env vars override per-provider API keys.

providers:
  synthetic:
    authRequired: true
    baseUrl: "https://api.synthetic.new/anthropic"
    authToken: "${SYNTHETIC_API_KEY}"
    model: "${SYNTHETIC_MODEL}"
    smallFastModel: "${SYNTHETIC_SMALL_MODEL}"
  deepseek:
    authRequired: true
    baseUrl: "https://api.deepseek.com/anthropic"
    authToken: "${DEEPSEEK_API_KEY}"
    model: "${DEEPSEEK_MODEL}"
    smallFastModel: "${DEEPSEEK_SMALL_MODEL}"
  minimax:
    authRequired: true
    baseUrl: "https://api.minimax.io/anthropic"
    authToken: "${MINIMAX_API_KEY}"
    model: "${MINIMAX_MODEL}"
    smallFastModel: "${MINIMAX_SMALL_MODEL}"
  zai:
    authRequired: true
    baseUrl: "https://api.z.ai/api/anthropic"
    authToken: "${ZAI_API_KEY}"
    model: "${ZAI_MODEL}"
    smallFastModel: "${ZAI_SMALL_MODEL}"
  openrouter:
    authRequired: true
    baseUrl: "https://openrouter.ai/api"
    authToken: "${OPENROUTER_API_KEY}"
    model: "${OPENROUTER_MODEL}"
    smallFastModel: "${OPENROUTER_SMALL_MODEL}"
  wafer:
    authRequired: true
    baseUrl: "https://pass.wafer.ai"
    authToken: "${WAFER_API_KEY}"
    model: "${WAFER_MODEL}"
    smallFastModel: "${WAFER_SMALL_MODEL}"
  claude:
    authRequired: false
    baseUrl: "https://api.anthropic.com"
  llamabarn:
    authRequired: false
    baseUrl: "${LLAMABARN_BASE_URL:-http://localhost:2276}"
    authToken: "${LLAMABARN_API_KEY}"
    model: "${LLAMABARN_MODEL}"
    smallFastModel: "${LLAMABARN_SMALL_MODEL}"
  lmstudio:
    authRequired: false
    baseUrl: "${LMSTUDIO_BASE_URL:-http://localhost:1234}"
    authToken: "${LMSTUDIO_API_KEY:-lmstudio}"
    model: "${LMSTUDIO_MODEL}"
    smallFastModel: "${LMSTUDIO_SMALL_MODEL}"
  llamacpp:
    authRequired: false
    baseUrl: "${LLAMACPP_BASE_URL:-http://localhost:8080}"
    authToken: "${LLAMACPP_API_KEY:-llamacpp}"
    model: "${LLAMACPP_MODEL}"
    smallFastModel: "${LLAMACPP_SMALL_MODEL}"
  omlx:
    authRequired: false
    baseUrl: "${OMLX_BASE_URL:-http://localhost:8000}"
    # A local placeholder avoids falling back to Claude account OAuth.
    authToken: "${OMLX_API_KEY:-omlx}"
    model: "${OMLX_MODEL}"
    smallFastModel: "${OMLX_SMALL_MODEL}"
    maxContextTokens: 0

doctor:
  probeConcurrency: 4

cli:
  defaultProvider: "zai"

optimization:
  disableNonessentialTraffic: true
  disableAutoupdater: true
  disableTelemetry: true
  disableErrorReporting: true
  disableCostWarnings: true
  apiTimeoutMs: 3000000       # 50-minute timeout
  maxOutputTokens: 200000
  nodeMaxOldSpaceSize: 8192   # MB for Node.js heap

# Router (optional) - override model routing.
# CONTRACT: only `default` is honored at runtime (it overrides the selected
# provider's model + smallFastModel). Format: "<provider>:<model>" where
# <provider> must match the provider you launch with. It is silently ignored
# if there is no ":", the provider segment doesn't match, or the model is empty.
# The slots below `default` are parsed but currently inert (no effect).
# router:
#   default: "provider:your-model-id"
#   # Reserved — parsed but not yet consumed:
#   # background: "provider:your-model-id"
#   # longContext: "provider:your-model-id"
#   # think: "provider:your-model-id"
#   # webSearch: "provider:your-model-id"
#   # longContextThreshold: 60000
